###############################################################################
# CENTRAL DIREWOLF CONFIGURATION
###############################################################################

# 1. Hardware Audio Configuration
# Run 'arecord -l' to determine your system's interface hardware index
ADEVICE plughw:1,0

# 2. Channel & Modem Modulation
CHANNEL 0
MODEM 1200

# 3. Virtual KISS Interface
# Binds Direwolf directly to the first port of the virtual cable
KISS PORT /dev/tnt0

# 4. Push-To-Talk (PTT) Configuration
# Adjust to point to your physical transceiver interface (e.g., PTT /dev/ttyUSB0 RTS)
PTT NONE

